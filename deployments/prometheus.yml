global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "streampulse-api"
    static_configs:
      - targets: ["api:8080"]
    metrics_path: /metrics

  # Scrapes OTLP metrics emitted by the API and re-exposed by the collector.
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
