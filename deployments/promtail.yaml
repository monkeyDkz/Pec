server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Picks up every docker container log; labels them with service name.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
    pipeline_stages:
      # API logs are already JSON — parse to make fields queryable in Grafana.
      - match:
          selector: '{service="api"}'
          stages:
            - json:
                expressions:
                  trace_id: trace_id
                  level: level
                  msg: msg
                  method: method
                  path: path
                  status: status
            - labels:
                level:
                trace_id:
