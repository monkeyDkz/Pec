receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # Metrics are scraped by Prometheus from this endpoint.
  prometheus:
    endpoint: "0.0.0.0:8889"
  # Traces are logged by the collector (no dedicated trace backend in dev).
  # Swap for an otlp exporter to Tempo/Jaeger in production.
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
