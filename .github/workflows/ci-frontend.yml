name: CI · Frontend

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze-and-test
    defaults:
      run:
        working-directory: frontend
    env:
      API_URL_VAR: ${{ vars.API_URL || 'https://staging.streampulse.example' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_URL=$API_URL_VAR
      - run: flutter build appbundle --release --dart-define=API_URL=$API_URL_VAR
      - uses: actions/upload-artifact@v4
        with:
          name: streampulse-android
          path: |
            frontend/build/app/outputs/flutter-apk/app-release.apk
            frontend/build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS (no-sign)
    runs-on: macos-latest
    needs: analyze-and-test
    defaults:
      run:
        working-directory: frontend
    env:
      API_URL_VAR: ${{ vars.API_URL || 'https://staging.streampulse.example' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=API_URL=$API_URL_VAR
